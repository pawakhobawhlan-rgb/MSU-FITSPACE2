<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSU FITSPACE - เพื่อนออกกำลังกาย มหาวิทยาลัยมหาสารคาม</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#FF5722',
                        secondary: '#2196F3',
                        dark: '#333333',
                        light: '#F5F5F5',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F3F4F6; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0; }
        .container { max-width: 480px; width: 100%; margin: 0 auto; background-color: #FFFFFF; height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .scrollable-content { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }
        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }
        .avatar-option.selected { border-color: #FF5722; box-shadow: 0 0 0 2px #FF5722; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #FF5722; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    
    <!-- LOADING VIEW -->
    <div id="view-loading" class="view active items-center justify-center bg-white z-50 absolute inset-0">
        <div class="text-center">
            <div class="loader"></div>
            <p class="text-dark font-medium mt-4">กำลังโหลด MSU FITSPACE...</p>
        </div>
    </div>

    <!-- REGISTER FORM VIEW -->
    <div id="view-register" class="view scrollable-content p-8">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-person-running text-white text-4xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-dark mb-2">MSU FITSPACE</h1>
            <p class="text-gray-500">ลงทะเบียนเพื่อใช้บริการสุขภาพ มหาวิทยาลัยมหาสารคาม</p>
        </div>

        <form id="register-form" class="space-y-5">
            <div class="text-center mb-6">
                <p class="text-sm font-medium text-dark mb-4">เลือกรูปโปรไฟล์ (Avatar)</p>
                <div class="flex justify-center gap-4">
                    <label class="avatar-option selected w-16 h-16 rounded-full border-4 border-transparent flex items-center justify-center cursor-pointer bg-light transition-all">
                        <input type="radio" name="avatar" value="avatar1.svg" class="hidden" checked>
                        <i class="fa-solid fa-user-ninja text-2xl text-dark"></i>
                    </label>
                    <label class="avatar-option w-16 h-16 rounded-full border-4 border-transparent flex items-center justify-center cursor-pointer bg-light transition-all">
                        <input type="radio" name="avatar" value="avatar2.svg" class="hidden">
                        <i class="fa-solid fa-user-astronaut text-2xl text-dark"></i>
                    </label>
                    <label class="avatar-option w-16 h-16 rounded-full border-4 border-transparent flex items-center justify-center cursor-pointer bg-light transition-all">
                        <input type="radio" name="avatar" value="avatar3.svg" class="hidden">
                        <i class="fa-solid fa-user-secret text-2xl text-dark"></i>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อของคุณ</label>
                <input type="text" id="reg-name" required placeholder="กรอกชื่อเล่นหรือชื่อจริง" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เพศของคุณ</label>
                <select id="reg-gender" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
                    <option value="male">ชาย</option>
                    <option value="female">หญิง</option>
                    <option value="other">อื่นๆ</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">คำแนะนำตัวสั้นๆ (Bio)</label>
                <input type="text" id="reg-bio" required placeholder="เช่น ชอบวิ่งเย็น เพื่อสุขภาพที่ดี" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
            </div>

            <button type="submit" class="w-full bg-primary text-white font-semibold py-4 rounded-xl hover:bg-orange-600 transition-all shadow-lg shadow-primary/20 mt-4">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="view-app" class="view bg-light">
        <header class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <div id="header-avatar" class="w-10 h-10 rounded-full flex items-center justify-center bg-light"></div>
                <div>
                    <h2 id="header-name" class="font-bold text-dark text-lg leading-tight">...</h2>
                    <span class="text-xs text-primary font-medium">เข้าสู่ระบบสำเร็จ</span>
                </div>
            </div>
            <button id="btn-logout" class="text-gray-400 hover:text-primary transition-all">
                <i class="fa-solid fa-right-from-bracket text-xl"></i>
            </button>
        </header>

        <div class="scrollable-content p-6 space-y-8">
            <!-- MATCHING PROFILES -->
            <section>
                <h3 class="font-bold text-dark text-lg mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-heart-pulse text-primary"></i> ค้นหาคู่หูสุขภาพ
                </h3>
                <div id="profiles-container" class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-light rounded-full flex items-center justify-center mb-3">
                            <i class="fa-solid fa-user-ninja text-3xl text-dark"></i>
                        </div>
                        <h4 class="font-bold text-dark">สมชาย</h4>
                        <p class="text-xs text-gray-500 mb-3 px-2 line-clamp-2">ชอบวิ่งฟิตเนสช่วงเย็น</p>
                        <button class="w-full bg-secondary text-white font-medium py-2 rounded-lg hover:bg-blue-600 transition-all text-sm">
                            ส่งคำขอคู่หู
                        </button>
                    </div>
                </div>
            </section>

            <!-- GYM CHECK IN -->
            <section class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-dark text-lg mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-dumbbell text-secondary"></i> เช็คอิน ศูนย์ออกกำลังกาย
                </h3>
                <div class="relative w-full rounded-2xl overflow-hidden mb-5">
                    <img src="https://images.unsplash.com/photo-1517838531652-f1797e559092?w=800&q=80" alt="Gym" class="w-full h-32 object-cover">
                    <div class="absolute top-0 right-0 bg-primary text-white font-bold px-3 py-1 m-3 rounded-full text-sm shadow-lg">
                        คิวปัจจุบัน: 5 คน
                    </div>
                </div>
                <button id="btn-checkin" class="w-full bg-primary text-white font-semibold py-4 rounded-xl hover:bg-orange-600 transition-all shadow-lg shadow-primary/20">
                    เช็คอินเข้าใช้งานศูนย์
                </button>
            </section>
        </div>
    </div>

</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged, updateProfile, signOut } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
    import { getFirestore, setDoc, doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: "AIzaSyBN1Ndn8gBQYobfgL3lo0cqI_XLpWnPYVUUU",
        authDomain: "msu-fitspace.firebaseapp.com",
        projectId: "msu-fitspace",
        storageBucket: "msu-fitspace.firebasestorage.app",
        messagingSenderId: "488027390888",
        appId: "1:488027390888:web:38d19d5d570c8ad3ec7539d",
        measurementId: "G-XJHBY6SN4J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
        document.getElementById(`view-${viewId}`).classList.add('active');
    }

    function initAuth() {
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDocRef = doc(db, 'users', user.uid);
                    const userDoc = await getDoc(userDocRef);

                    if (userDoc.exists()) {
                        currentUser = { uid: user.uid, ...userDoc.data() };
                        updateAppHeader();
                        switchView('app');
                    } else {
                        switchView('register');
                    }
                } catch (err) {
                    console.error("Error fetching user data:", err);
                    switchView('register');
                }
            } else {
                switchView('register');
            }
            setTimeout(() => {
                const loadingView = document.getElementById('view-loading');
                if (loadingView) loadingView.classList.remove('active');
            }, 400);
        });
    }

    function updateAppHeader() {
        if (!currentUser) return;
        document.getElementById('header-name').textContent = currentUser.name;
        let iconClass = 'fa-solid fa-user-ninja';
        if (currentUser.avatar === 'avatar2.svg') iconClass = 'fa-solid fa-user-astronaut';
        if (currentUser.avatar === 'avatar3.svg') iconClass = 'fa-solid fa-user-secret';
        document.getElementById('header-avatar').innerHTML = `<i class="${iconClass} text-xl text-dark"></i>`;
    }

    document.querySelectorAll('input[name="avatar"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            document.querySelectorAll('.avatar-option').forEach(l => l.classList.remove('selected'));
            e.target.parentElement.classList.add('selected');
        });
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const gender = document.getElementById('reg-gender').value;
        const bio = document.getElementById('reg-bio').value;
        const avatarRadio = document.querySelector('input[name="avatar"]:checked');
        const avatar = avatarRadio ? avatarRadio.value : 'avatar1.svg';

        try {
            const userCredential = await signInAnonymously(auth);
            const user = userCredential.user;

            await setDoc(doc(db, 'users', user.uid), {
                name, gender, bio, avatar, createdAt: new Date().toISOString()
            });

            await updateProfile(user, { displayName: name });
        } catch (error) {
            console.error("Registration error:", error);
            alert("เกิดข้อผิดพลาดในการลงทะเบียน โปรดลองอีกครั้ง");
        }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await signOut(auth);
        switchView('register');
    });

    document.getElementById('btn-checkin').addEventListener('click', () => {
        alert("เช็คอินสำเร็จเรียบร้อย!");
    });

</script>
</body>
</html>
