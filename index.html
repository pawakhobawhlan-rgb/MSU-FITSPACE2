<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSU FITSPACE - คอมมูนิตี้คนรักสุขภาพ มมส.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        msuYellow: '#FACC15',
                        msuDark: '#1F2937',
                    }
                }
            }
        }
    </script>
    <!-- Google Font (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-msuDark text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="bg-msuYellow text-msuDark font-bold px-2.5 py-1 rounded-lg text-lg">MSU</span>
                <span class="text-xl font-bold tracking-wide">FITSPACE</span>
            </div>
            <div id="nav-auth-section" class="flex items-center space-x-3">
                <!-- Dynamic Auth Button -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- VIEW 1: AUTHENTICATION (Login / Register) -->
        <section id="view-auth" class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 mt-10">
            <div class="text-center mb-6">
                <h2 id="auth-title" class="text-2xl font-bold text-gray-900">เข้าสู่ระบบ MSU FITSPACE</h2>
                <p class="text-sm text-gray-500 mt-1">หาเพื่อนออกกำลังกายใน มมส. แบบปลอดภัยและรู้จริง</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล (มหาวิทยาลัยหรือส่วนตัว)</label>
                    <input type="email" id="auth-email" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-msuYellow focus:outline-none" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="auth-password" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-msuYellow focus:outline-none" placeholder="อย่างน้อย 6 ตัวอักษร">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-msuYellow text-msuDark font-semibold py-2.5 rounded-xl hover:bg-yellow-400 transition shadow">
                    เข้าสู่ระบบ
                </button>
            </form>

            <div class="text-center mt-4">
                <button id="auth-toggle-btn" class="text-sm text-blue-600 hover:underline">
                    ยังไม่มีบัญชี? สมัครสมาชิกใหม่
                </button>
            </div>
        </section>

        <!-- VIEW 2: PROFILE SETUP (First time after register) -->
        <section id="view-profile-setup" class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 mt-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">ตั้งค่าโปรไฟล์ของคุณ</h2>
            <p class="text-sm text-gray-500 mb-6 text-center">แนะนำตัวให้เพื่อนๆ ใน มมส. รู้จักกันเถอะ</p>
            
            <form id="profile-form" class="space-y-4">
                <div class="flex flex-col items-center mb-4">
                    <div class="w-24 h-24 rounded-full bg-gray-200 overflow-hidden mb-2 border-2 border-msuYellow flex items-center justify-center">
                        <img id="profile-preview" src="" alt="Preview" class="w-full h-full object-cover hidden">
                        <span id="profile-placeholder" class="text-gray-400 text-xs">รูปโปรไฟล์</span>
                    </div>
                    <input type="file" id="profile-image-input" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-yellow-700 hover:file:bg-yellow-100">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ - นามสกุล / ชื่อเล่น</label>
                    <input type="text" id="setup-name" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-msuYellow focus:outline-none" placeholder="เช่น ไผ่ รัฐประศาสนศาสตร์">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อายุ</label>
                    <input type="number" id="setup-age" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-msuYellow focus:outline-none" placeholder="เช่น 19">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">กีฬาที่ชื่นชอบ</label>
                    <select id="setup-sport" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-msuYellow focus:outline-none">
                        <option value="ฟิตเนส / เวทเทรนนิ่ง">ฟิตเนส / เวทเทรนนิ่ง</option>
                        <option value="วิ่ง / คาร์ดิโอ">วิ่ง / คาร์ดิโอ</option>
                        <option value="แบดมินตัน">แบดมินตัน</option>
                        <option value="ฟุตบอล / บอลกระชับมิตร">ฟุตบอล / บอลกระชับมิตร</option>
                        <option value="บาสเกตบอล">บาสเกตบอล</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">แนะนำตัวสั้นๆ (Bio)</label>
                    <textarea id="setup-bio" rows="2" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-msuYellow focus:outline-none" placeholder="เช่น วิ่งช่วงเย็นที่สนามลู่ฟ้าครับ"></textarea>
                </div>
                <button type="submit" class="w-full bg-msuYellow text-msuDark font-semibold py-2.5 rounded-xl hover:bg-yellow-400 transition shadow">
                    บันทึกโปรไฟล์และเริ่มใช้งาน
                </button>
            </form>
        </section>

        <!-- VIEW 3: MAIN APP (Feed & Dashboard) -->
        <section id="view-main" class="hidden space-y-6">
            
            <!-- User Info Bar -->
            <div class="bg-white rounded-2xl shadow p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img id="user-avatar" src="" alt="Avatar" class="w-12 h-12 rounded-full object-cover border border-msuYellow">
                    <div>
                        <h3 id="user-display-name" class="font-bold text-gray-900">ชื่อผู้ใช้</h3>
                        <p id="user-display-sport" class="text-xs text-gray-500">กีฬาโปรด: -</p>
                    </div>
                </div>
                <button id="logout-btn" class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg text-gray-600 transition">ออกจากระบบ</button>
            </div>

            <!-- Create Post Card -->
            <div class="bg-white rounded-2xl shadow p-5">
                <h3 class="font-bold text-gray-800 mb-3">📢 ชวนเพื่อนออกกำลังกายกัน</h3>
                <form id="post-form" class="space-y-3">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">ประเภทกีฬา</label>
                            <select id="post-sport" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-msuYellow">
                                <option value="ฟิตเนส / เวทเทรนนิ่ง">ฟิตเนส / เวทเทรนนิ่ง</option>
                                <option value="วิ่ง / คาร์ดิโอ">วิ่ง / คาร์ดิโอ</option>
                                <option value="แบดมินตัน">แบดมินตัน</option>
                                <option value="ฟุตบอล / บอลกระชับมิตร">ฟุตบอล / บอลกระชับมิตร</option>
                                <option value="บาสเกตบอล">บาสเกตบอล</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">สถานที่ใน มมส.</label>
                            <select id="post-location" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-msuYellow">
                                <option value="สนามลู่ฟ้า มมส.">สนามลู่ฟ้า มมส.</option>
                                <option value="สนามลู่แดง มมส.">สนามลู่แดง มมส.</option>
                                <option value="ศูนย์กีฬากลาง มมส.">ศูนย์กีฬากลาง มมส.</option>
                                <option value="ฟิตเนสโซนหอใน มมส.">ฟิตเนสโซนหอใน มมส.</option>
                                <option value="สนามพฤกษศาสตร์ มมส.">สนามพฤกษศาสตร์ มมส.</option>
                                <option value="อื่นๆ (ระบุในรายละเอียด)">อื่นๆ (ระบุในรายละเอียด)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">รายละเอียดและเวลานัดหมาย</label>
                        <textarea id="post-content" rows="2" placeholder="เช่น เย็นนี้ 17.30 น. เจอกันสนามลู่ฟ้าวิ่งยาวๆ ครับ" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-msuYellow"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-msuYellow text-msuDark font-semibold py-2 rounded-xl text-sm hover:bg-yellow-400 transition shadow">
                        โพสต์ชวนเพื่อน
                    </button>
                </form>
            </div>

            <!-- Filter Bar -->
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-gray-800 text-lg">ฟีดประกาศหาเพื่อน</h3>
                <select id="filter-sport" class="px-3 py-1.5 border rounded-xl text-sm bg-white">
                    <option value="all">กีฬาทั้งหมด</option>
                    <option value="ฟิตเนส / เวทเทรนนิ่ง">ฟิตเนส / เวทเทรนนิ่ง</option>
                    <option value="วิ่ง / คาร์ดิโอ">วิ่ง / คาร์ดิโอ</option>
                    <option value="แบดมินตัน">แบดมินตัน</option>
                    <option value="ฟุตบอล / บอลกระชับมิตร">ฟุตบอล / บอลกระชับมิตร</option>
                    <option value="บาสเกตบอล">บาสเกตบอล</option>
                </select>
            </div>

            <!-- Feed List Container -->
            <div id="posts-container" class="space-y-4">
                <!-- Posts will be injected here -->
            </div>
        </section>

        <!-- VIEW 4: CHAT ROOM -->
        <section id="view-chat" class="hidden bg-white rounded-2xl shadow flex flex-col h-[75vh]">
            <div class="p-4 border-b flex items-center justify-between bg-msuDark text-white rounded-t-2xl">
                <div class="flex items-center space-x-3">
                    <button id="back-to-feed-btn" class="text-sm bg-gray-700 px-3 py-1 rounded-lg hover:bg-gray-600">← กลับ</button>
                    <h3 id="chat-room-title" class="font-bold">ห้องแชทพูดคุย</h3>
                </div>
            </div>
            <div id="chat-messages" class="flex-grow p-4 overflow-y-auto space-y-3 bg-gray-50">
                <!-- Messages injected here -->
            </div>
            <form id="chat-form" class="p-3 border-t bg-white rounded-b-2xl flex space-x-2">
                <input type="text" id="chat-input" placeholder="พิมพ์ข้อความนัดแนะ..." required class="flex-grow px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-msuYellow focus:outline-none">
                <button type="submit" class="bg-msuYellow text-msuDark px-5 py-2 rounded-xl font-semibold text-sm hover:bg-yellow-400">ส่ง</button>
            </form>
        </section>

    </main>

    <!-- Firebase SDKs (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, sendEmailVerification 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, getDoc, collection, addDoc, 
            query, orderBy, onSnapshot, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // ⚙️ แทนที่ค่า Firebase Config ของคุณตรงนี้
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Elements
        const viewAuth = document.getElementById('view-auth');
        const viewProfileSetup = document.getElementById('view-profile-setup');
        const viewMain = document.getElementById('view-main');
        const viewChat = document.getElementById('view-chat');

        const authForm = document.getElementById('auth-form');
        const authTitle = document.getElementById('auth-title');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authToggleBtn = document.getElementById('auth-toggle-btn');
        
        let isRegisterMode = false;
        let currentUserData = null;
        let currentActiveChatId = null;
        let base64ImageString = "";

        // Toggle Login / Register
        authToggleBtn.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            authTitle.innerText = isRegisterMode ? "สมัครสมาชิก MSU FITSPACE" : "เข้าสู่ระบบ MSU FITSPACE";
            authSubmitBtn.innerText = isRegisterMode ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
            authToggleBtn.innerText = isRegisterMode ? "มีบัญชีอยู่แล้ว? เข้าสู่ระบบ" : "ยังไม่มีบัญชี? สมัครสมาชิกใหม่";
        });

        // Handle Auth Submit
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                if (isRegisterMode) {
                    const userCred = await createUserWithEmailAndPassword(auth, email, password);
                    await sendEmailVerification(userCred.user);
                    alert("สมัครสมาชิกสำเร็จ! ระบบได้ส่งลิงก์ยืนยันไปที่อีเมลของคุณแล้ว กรุณากรอกโปรไฟล์ต่อได้เลยครับ");
                    viewAuth.classList.add('hidden');
                    viewProfileSetup.classList.remove('hidden');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert("เกิดข้อผิดพลาด: " + error.message);
            }
        });

        // Handle Profile Image Conversion to Base64
        const profileImageInput = document.getElementById('profile-image-input');
        const profilePreview = document.getElementById('profile-preview');
        const profilePlaceholder = document.getElementById('profile-placeholder');

        profileImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    base64ImageString = uploadEvent.target.result;
                    profilePreview.src = base64ImageString;
                    profilePreview.classList.remove('hidden');
                    profilePlaceholder.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle Profile Setup Submit
        const profileForm = document.getElementById('profile-form');
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;

            const name = document.getElementById('setup-name').value;
            const age = document.getElementById('setup-age').value;
            const sport = document.getElementById('setup-sport').value;
            const bio = document.getElementById('setup-bio').value;

            const userData = {
                uid: auth.currentUser.uid,
                email: auth.currentUser.email,
                name,
                age,
                sport,
                bio,
                avatar: base64ImageString || "https://via.placeholder.com/150",
                createdAt: serverTimestamp()
            };

            try {
                await setDoc(doc(db, "users", auth.currentUser.uid), userData);
                currentUserData = userData;
                viewProfileSetup.classList.add('hidden');
                viewMain.classList.remove('hidden');
                loadUserDataAndFeed();
            } catch (error) {
                alert("บันทึกโปรไฟล์ไม่สำเร็จ: " + error.message);
            }
        });

        // Auth State Observer
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                    viewAuth.classList.add('hidden');
                    viewProfileSetup.classList.add('hidden');
                    viewMain.classList.remove('hidden');
                    loadUserDataAndFeed();
                } else {
                    viewAuth.classList.add('hidden');
                    viewProfileSetup.classList.remove('hidden');
                }
            } else {
                viewAuth.classList.remove('hidden');
                viewProfileSetup.classList.add('hidden');
                viewMain.classList.add('hidden');
                viewChat.classList.add('hidden');
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // Load Main Feed & User Bar
        function loadUserDataAndFeed() {
            if (!currentUserData) return;
            document.getElementById('user-avatar').src = currentUserData.avatar;
            document.getElementById('user-display-name').innerText = currentUserData.name;
            document.getElementById('user-display-sport').innerText = `กีฬาโปรด: ${currentUserData.sport}`;
            loadPosts();
        }

        // Create Post
        const postForm = document.getElementById('post-form');
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const sport = document.getElementById('post-sport').value;
            const location = document.getElementById('post-location').value;
            const content = document.getElementById('post-content').value;

            try {
                await addDoc(collection(db, "posts"), {
                    uid: currentUserData.uid,
                    authorName: currentUserData.name,
                    authorAvatar: currentUserData.avatar,
                    sport,
                    location,
                    content,
                    createdAt: serverTimestamp()
                });
                postForm.reset();
                alert("โพสต์ชวนเพื่อนสำเร็จ!");
            } catch (error) {
                alert("โพสต์ไม่สำเร็จ: " + error.message);
            }
        });

        // Load Posts Feed with Filter
        const filterSport = document.getElementById('filter-sport');
        filterSport.addEventListener('change', loadPosts);

        function loadPosts() {
            const postsContainer = document.getElementById('posts-container');
            const selectedFilter = filterSport.value;

            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                postsContainer.innerHTML = "";
                if (snapshot.empty) {
                    postsContainer.innerHTML = `<p class="text-center text-gray-400 py-6 bg-white rounded-2xl shadow">ยังไม่มีโพสต์ชวนออกกำลังกาย มาสร้างโพสต์แรกกันเลย!</p>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const postId = docSnap.id;

                    if (selectedFilter !== "all" && post.sport !== selectedFilter) {
                        return;
                    }

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow p-4 border border-gray-100 space-y-3";
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <img src="${post.authorAvatar || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover border">
                                <div>
                                    <h4 class="font-bold text-gray-900 text-sm">${post.authorName}</h4>
                                    <span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full font-medium">${post.sport}</span>
                                </div>
                            </div>
                            <span class="text-xs font-semibold text-gray-500 bg-gray-100 px-2.5 py-1 rounded-lg">📍 ${post.location}</span>
                        </div>
                        <p class="text-gray-700 text-sm mt-2">${post.content}</p>
                        <div class="flex justify-end pt-2 border-t">
                            <button onclick="openChatRoom('${postId}', '${post.authorName}')" class="bg-gray-900 text-white text-xs px-4 py-2 rounded-xl hover:bg-gray-800 transition shadow">
                                พูดคุย / นัดหมาย
                            </button>
                        </div>
                    `;
                    postsContainer.appendChild(card);
                });
            });
        }

        // Global function to open chat room
        window.openChatRoom = async function(postId, postAuthorName) {
            currentActiveChatId = postId;
            viewMain.classList.add('hidden');
            viewChat.classList.remove('hidden');
            document.getElementById('chat-room-title').innerText = `ห้องแชท: ${postAuthorName}`;
            loadMessages(postId);
        };

        document.getElementById('back-to-feed-btn').addEventListener('click', () => {
            viewChat.classList.add('hidden');
            viewMain.classList.remove('hidden');
            currentActiveChatId = null;
        });

        // Chat Message Sending
        const chatForm = document.getElementById('chat-form');
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const textInput = document.getElementById('chat-input');
            const text = textInput.value.trim();
            if (!text || !currentActiveChatId) return;

            try {
                await addDoc(collection(db, "posts", currentActiveChatId, "messages"), {
                    senderId: currentUserData.uid,
                    senderName: currentUserData.name,
                    text,
                    createdAt: serverTimestamp()
                });
                textInput.value = "";
            } catch (error) {
                alert("ส่งข้อความไม่สำเร็จ: " + error.message);
            }
        });

        // Load Real-time Messages
        function loadMessages(postId) {
            const chatMessagesContainer = document.getElementById('chat-messages');
            const q = query(collection(db, "posts", postId, "messages"), orderBy("createdAt", "asc"));

            onSnapshot(q, (snapshot) => {
                chatMessagesContainer.innerHTML = "";
                if (snapshot.empty) {
                    chatMessagesContainer.innerHTML = `<p class="text-center text-gray-400 py-4 text-sm">ยังไม่มีข้อความ เริ่มทักทายพูดคุยกันได้เลย</p>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.senderId === currentUserData.uid;

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    msgDiv.innerHTML = `
                        <span class="text-[10px] text-gray-400 mb-1">${msg.senderName}</span>
                        <div class="max-w-[75%] px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-msuYellow text-msuDark rounded-br-none' : 'bg-gray-200 text-gray-800 rounded-bl-none'}">
                            ${msg.text}
                        </div>
                    `;
                    chatMessagesContainer.appendChild(msgDiv);
                });
                chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
            });
        }
    </script>
</body>
</html>
